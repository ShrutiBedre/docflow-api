name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore tests/DocFlow.Tests/DocFlow.Tests.csproj

      - name: Build
        run: dotnet build tests/DocFlow.Tests/DocFlow.Tests.csproj --no-restore -c Release

      - name: Test
        run: dotnet test tests/DocFlow.Tests/DocFlow.Tests.csproj --no-build -c Release --verbosity normal
